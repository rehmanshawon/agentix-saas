# File: docker-compose.yml
version: "3.8"

services:
  # The Transactional Database (Users, Workspaces, Settings)
  mysql:
    image: mysql:8.0
    container_name: agentix_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: agentix
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: agentix_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # NOTE: The API and Web services are commented out for local development.
  # You will run these locally using `pnpm dev` instead.
